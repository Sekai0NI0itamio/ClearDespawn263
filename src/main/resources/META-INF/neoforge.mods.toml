modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Itamio, StrikerRocker"
description="Makes items blink before they despawn. Unofficial NeoForge port of ClearDespawn by StrikerRockers-Mods (StrikerRocker) for Minecraft 26.3 (NeoForge). Client-side only. See NOTICE for credit and licensing details."

[[dependencies.${mod_id}]]
    modId="neoforge"
    mandatory=true
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
